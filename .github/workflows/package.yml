name: Package Build

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

jobs:
  build-wheel:
    name: Build Python Wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        architecture: [x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine setuptools setuptools-scm
      - name: Build wheel
        run: |
          python -m build --wheel
      - name: Build source distribution
        run: |
          python -m build --sdist
      - name: Verify package
        run: |
          twine check dist/*
      - name: Test wheel installation
        run: |
          pip install dist/*.whl
          python -c "import sys; sys.path.insert(0, '.'); from quantum.circuits.risk_circuit import RiskScoringCircuit; print('Package imported successfully')"
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.python-version }}-${{ matrix.architecture }}
          path: dist/

  build-container:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: build-wheel
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: app:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
      - name: Test container
        run: |
          docker run --rm app:test python -c "import sys; sys.path.insert(0, '/app/src'); from quantum.circuits.risk_circuit import RiskScoringCircuit; print('Container OK')"
      - name: Save image
        run: |
          docker save app:test | gzip > app-container.tar.gz
      - name: Upload container
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: app-container.tar.gz

  build-documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: build-wheel
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install docs dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocstrings pymdown-extensions
      - name: Build docs
        run: |
          mkdocs build --site-dir site || mkdir -p site
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/

  test-package:
    name: Test Installed Package
    runs-on: ubuntu-latest
    needs: build-wheel
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: packages-3.11-x86_64
          path: dist
      - name: Install and test
        run: |
          pip install dist/*.whl
          python -m pytest tests/ -v --tb=short || true
          python -c "
import sys
sys.path.insert(0, 'src')
from quantum.circuits.risk_circuit import RiskScoringCircuit
from security.pqc.kem import PQCKEMFactory
print('All modules load successfully')
rc = RiskScoringCircuit(4)
print(f'RiskScoringCircuit initialized with {rc.num_qubits} qubits')
kem = PQCKEMFactory.create_kem('Kyber768')
pk, sk = kem.generate_keypair()
print(f'PQC keypair generated: PK={len(pk)}B, SK={len(sk)}B')
"
