repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: [--line-length=120]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: [--max-line-length=120, --ignore=E203,W503]

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [numpy, scipy]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-r, src/, -x, tests/]

  - repo: local
    hooks:
      - id: quantum-module-check
        name: Quantum Module Import Check
        entry: python -c "import sys; sys.path.insert(0, 'src'); from quantum.circuits.risk_circuit import RiskScoringCircuit; from security.pqc.kem import PQCKEMFactory; print('Quantum modules OK')"
        language: python
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Run unit tests
        entry: python -m pytest tests/unit/ -v --tb=short
        language: python
        pass_filenames: false
        always_run: true
        stages: [push]
