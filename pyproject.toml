[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adult-creator-deplatforming-insurance"
version = "1.0.0"
description = "Adult creator deplatforming insurance and risk score with quantum computing"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "quantumworld-dpdns-io", email = "dev@quantumworld.io"}
]
requires-python = ">=3.10"
keywords = ["quantum", "insurance", "risk-scoring", "pqc", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Quantum Computing",
    "Topic :: Office/Business :: Financial :: Insurance",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]
optional-dependencies = {
    "quantum": ["qiskit>=0.45.0", "cudaq>=0.5.0"],
    "test": ["robotframework>=6.0", "pytest>=7.0"],
    "dev": ["flake8", "black", "isort", "mypy"],
    "all": ["qiskit>=0.45.0", "cudaq>=0.5.0", "robotframework>=6.0"],
}

[project.urls]
"Homepage" = "https://github.com/quantumworld-dpdns-io/adult-creator-deplatforming-insurance"
"Bug Tracker" = "https://github.com/quantumworld-dpdns-io/adult-creator-deplatforming-insurance/issues"
"Documentation" = "https://quantumworld-dpdns-io.github.io/adult-creator-deplatforming-insurance"

[project.scripts]
quantum-risk = "quantum.cli:main"
pqc-keygen = "security.cli:keygen_main"
run-tests = "scripts.run_tests:main"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
